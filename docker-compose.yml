version: '3.8'

x-service-defaults: &service-defaults
  image: gearbox-service:latest
  build:
    context: ./backend
    dockerfile: service/Dockerfile
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgresql://gearbox_user:password@postgres-primary:5432/gearbox
    DATABASE_READ_REPLICA_URL: postgresql://gearbox_user:password@postgres-replica:5432/gearbox
    SHARD_0_DATABASE_URL: ${SHARD_0_DATABASE_URL:-postgresql://gearbox_user:password@postgres-primary:5432/gearbox}
    SHARD_1_DATABASE_URL: ${SHARD_1_DATABASE_URL:-postgresql://gearbox_user:password@postgres-primary:5432/gearbox}
    REDIS_URL: ${REDIS_URL}
    KAFKA_BROKERS: ${KAFKA_BROKERS:-${KAFKA_HOST:-}}
    KAFKA_USERNAME: ${KAFKA_USERNAME:-${KAFKA_USER:-}}
    KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
    KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-scram-sha-256}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  depends_on:
    postgres-primary:
      condition: service_healthy
    postgres-replica:
      condition: service_started

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gearbox-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: gearbox-pg-primary
    volumes:
      - postgres-primary-data:/bitnami/postgresql
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: password
      POSTGRESQL_USERNAME: gearbox_user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: gearbox
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearbox_user -d gearbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: gearbox-pg-replica
    volumes:
      - postgres-replica-data:/bitnami/postgresql
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "5433:5432"

  service-tier-6:
    <<: *service-defaults
    container_name: gearbox-tier-6
    command: ["sh", "-c", "npx prisma db push --skip-generate && node dist/server.js"]
    environment:
      <<: *service-env
      PORT: 4006
      TIER: 6
    ports:
      - "4006:4006"

  service-tier-5:
    <<: *service-defaults
    container_name: gearbox-tier-5
    environment:
      <<: *service-env
      PORT: 4005
      TIER: 5
    ports:
      - "4005:4005"

  service-tier-4:
    <<: *service-defaults
    container_name: gearbox-tier-4
    environment:
      <<: *service-env
      PORT: 4004
      TIER: 4
    ports:
      - "4004:4004"

  service-tier-3:
    <<: *service-defaults
    container_name: gearbox-tier-3
    environment:
      <<: *service-env
      PORT: 4003
      TIER: 3
    ports:
      - "4003:4003"

  service-tier-2:
    <<: *service-defaults
    container_name: gearbox-tier-2
    environment:
      <<: *service-env
      PORT: 4002
      TIER: 2
    ports:
      - "4002:4002"

  service-tier-1:
    <<: *service-defaults
    container_name: gearbox-tier-1
    environment:
      <<: *service-env
      PORT: 4001
      TIER: 1
    ports:
      - "4001:4001"

  email-worker:
    <<: *service-defaults
    container_name: gearbox-email-worker
    command: ["node", "dist/worker.js"]
    environment:
      <<: *service-env
      TIER: 3

  proxy:
    image: gearbox-proxy:latest
    build:
      context: ./backend
      dockerfile: proxy/Dockerfile
    container_name: gearbox-proxy
    environment:
      PORT: 3000
      LOG_LEVEL: info
      TIER_6_URL: http://service-tier-6:4006
      TIER_5_URL: http://service-tier-5:4005
      TIER_4_URL: http://service-tier-4:4004
      TIER_3_URL: http://service-tier-3:4003
      TIER_2_URL: http://service-tier-2:4002
      TIER_1_URL: http://service-tier-1:4001
    ports:
      - "3000:3000"
    depends_on:
      - service-tier-6
      - service-tier-5
      - service-tier-4
      - service-tier-3
      - service-tier-2
      - service-tier-1

volumes:
  postgres-primary-data:
  postgres-replica-data:
