version: '3.8'

x-service-defaults: &service-defaults
  image: gearbox-service:latest
  build:
    context: ./backend
    dockerfile: service/Dockerfile
  restart: unless-stopped
  mem_limit: 256m
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: ${DATABASE_URL:-postgresql://gearbox_user:password@postgres-primary:5432/gearbox}
    DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-postgresql://gearbox_user:password@postgres-replica:5432/gearbox}
    SHARD_0_DATABASE_URL: ${SHARD_0_DATABASE_URL:-postgresql://gearbox_user:password@postgres-primary:5432/gearbox}
    SHARD_1_DATABASE_URL: ${SHARD_1_DATABASE_URL:-postgresql://gearbox_user:password@postgres-primary:5432/gearbox}
    REDIS_URL: ${REDIS_URL}
    KAFKA_BROKERS: ${KAFKA_BROKERS:-${KAFKA_HOST:-}}
    KAFKA_USERNAME: ${KAFKA_USERNAME:-${KAFKA_USER:-}}
    KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
    KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-scram-sha-256}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s
  depends_on:
    postgres-primary:
      condition: service_healthy
    postgres-replica:
      condition: service_healthy
    db-migrate:
      condition: service_completed_successfully

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gearbox-jaeger
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: gearbox-pg-primary
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - postgres-primary-data:/bitnami/postgresql
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: password
      POSTGRESQL_USERNAME: gearbox_user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: gearbox
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearbox_user -d gearbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: gearbox-pg-replica
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - postgres-replica-data:/bitnami/postgresql
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearbox_user -d gearbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    <<: *service-defaults
    container_name: gearbox-db-migrate
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres-primary:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: gearbox-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    mem_limit: 256m
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana:latest
    container_name: gearbox-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/gearbox-overview.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - prometheus

  service-tier-6:
    <<: *service-defaults
    container_name: gearbox-tier-6
    command: ["node", "dist/server.js"]
    environment:
      <<: *service-env
      PORT: 4006
      TIER: 6
    ports:
      - "127.0.0.1:4006:4006"

  service-tier-5:
    <<: *service-defaults
    container_name: gearbox-tier-5
    environment:
      <<: *service-env
      PORT: 4005
      TIER: 5
    ports:
      - "127.0.0.1:4005:4005"

  service-tier-4:
    <<: *service-defaults
    container_name: gearbox-tier-4
    environment:
      <<: *service-env
      PORT: 4004
      TIER: 4
    ports:
      - "127.0.0.1:4004:4004"

  service-tier-3:
    <<: *service-defaults
    container_name: gearbox-tier-3
    environment:
      <<: *service-env
      PORT: 4003
      TIER: 3
    ports:
      - "127.0.0.1:4003:4003"

  service-tier-2:
    <<: *service-defaults
    container_name: gearbox-tier-2
    environment:
      <<: *service-env
      PORT: 4002
      TIER: 2
    ports:
      - "127.0.0.1:4002:4002"

  service-tier-1:
    <<: *service-defaults
    container_name: gearbox-tier-1
    environment:
      <<: *service-env
      PORT: 4001
      TIER: 1
    ports:
      - "127.0.0.1:4001:4001"

  email-worker:
    <<: *service-defaults
    container_name: gearbox-email-worker
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    environment:
      <<: *service-env
      TIER: 3

  proxy:
    image: gearbox-proxy:latest
    build:
      context: ./backend
      dockerfile: proxy/Dockerfile
    container_name: gearbox-proxy
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 3000
      LOG_LEVEL: info
      TIER_6_URL: http://service-tier-6:4006
      TIER_5_URL: http://service-tier-5:4005
      TIER_4_URL: http://service-tier-4:4004
      TIER_3_URL: http://service-tier-3:4003
      TIER_2_URL: http://service-tier-2:4002
      TIER_1_URL: http://service-tier-1:4001
    ports:
      - "3000:3000"
    depends_on:
      service-tier-6:
        condition: service_healthy
      service-tier-5:
        condition: service_healthy
      service-tier-4:
        condition: service_healthy
      service-tier-3:
        condition: service_healthy
      service-tier-2:
        condition: service_healthy
      service-tier-1:
        condition: service_healthy

volumes:
  postgres-primary-data:
  postgres-replica-data:
  prometheus-data:
  grafana-data:
